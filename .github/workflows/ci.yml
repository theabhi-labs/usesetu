name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      # Placeholder — wire in `npm test` once the Vitest/Supertest suite
      # lands (see README "Testing" section for the planned structure).
      # - name: Test
      #   run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (validation only, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: csc-os-backend:ci
