version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: csc-os-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: initializes the replica set exactly once. Required because
  # request/payment creation in this app uses MongoDB session transactions
  # (see README "MongoDB replica set required for transactions"), which a
  # standalone mongod does not support.
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --eval
      "try { rs.status() } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: csc-os-app
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/csc-os?replicaSet=rs0
    ports:
      - "5000:5000"
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: csc-os-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo-data:
  app-logs:
