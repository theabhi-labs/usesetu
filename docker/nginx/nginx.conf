# Rate limiting zone: 10 requests/sec per IP with burst — a coarse edge
# defense layer in front of the application's own per-route rate limiters
# (see security.middleware.ts), not a replacement for them.
limit_req_zone $binary_remote_addr zone=csc_api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # CSC OS handles document uploads (Aadhaar/PAN/photos) — allow up to 10MB,
    # matching the Express body-parser limit in app.ts.
    client_max_body_size 10M;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # Security headers — belt-and-suspenders alongside Helmet inside the app.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /health {
        proxy_pass http://app:5000;
        access_log off;
    }

    location /api/ {
        limit_req zone=csc_api_limit burst=20 nodelay;

        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
